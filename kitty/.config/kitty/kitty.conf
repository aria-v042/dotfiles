
# === LOOKS ============================================================

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# Transparency
background_opacity 0.90

# Window title bar
hide_window_decorations yes

# Tab bar style
tab_bar_style powerline

# Minimum number of tabs to enable tab bar
tab_bar_min_tabs 1

# Cursor
cursor_trail 1


# === BEHAVIOR ==========================================================

# Bell
enable_audio_bell no

# Scrollback (default = 2000)
scrollback_lines 10000

# Open new OS windows in current working directory
map ctrl+shift+n new_os_window_with_cwd

# Open new tabs in current working directory
map Ctrl+Shift+t new_tab_with_cwd

# Open new split windows in current working directory
map ctrl+shift+enter new_window_with_cwd

# Window multiplexing layouts (splits, tall, fat, grid)
enabled_layouts splits:split_axis=auto
# enabled_layouts splits:equalize_on_window_close=true;proportional=true


# === KEYMAPS ==========================================================

# Rotate the current window's split axis
map ctrl+shift+alt+enter layout_action rotate

# Navigate splits
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Move splits
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+j move_window down
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+l move_window right

# Detach split to new OS window
map ctrl+shift+d detach_window ask


# === LOCAL CONFIG ======================================================

include local.conf
