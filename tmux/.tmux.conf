
# === BASIC SETTINGS ===

# Set second prefix for better ergonomics
set -g prefix2 C-s
bind C-s send-prefix

# Colors
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-kitty:RGB"

# Eliminate delay after pressing Escape
set -sg escape-time 0

# Time (ms) allowed for repeatable key presses 
set -g repeat-time 500

# Scrollback buffer size (lines)
set -g history-limit 50000

# Mouse support
set -g mouse on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Enable focus events for vim autoread
set -g focus-events on


# === APPEARANCE ===

# Tmux theme (v3.8+)
set -gq theme terminal

# Pane border style
set -g pane-active-border-style fg=#b042ff		# Cursor violet

# Status bar position
set -g status-position top

# Status bar length
set -g status-left-length 200
set -g status-right-length 200

# Status bar style
set -g status-left '#S // '
set -g status-right '/ %H:%M // %d.%m.%Y '

# Window status style
setw -g window-status-current-style bold

# Set terminal window/tab title 
set -g set-titles on
set -g set-titles-string "tmux/#S"


